	<div style="direction:rtl;font-weight:bold">الَّذِينَ كَفَرُوا وَصَدُّوا عَنْ سَبِيلِ اللَّهِ زِدْنَاهُمْ عَذَابًا فَوْقَ الْعَذَابِ بِمَا كَانُوا يُفْسِدُونَ</div><div>Denjenigen, die ungläubig sind und von Allahs Weg abhalten, fügen Wir noch Strafe zu über ihre Strafe hinaus dafür, daß sie Unheil zu stiften pflegten.</div>
